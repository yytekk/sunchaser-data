name: Mise à jour des données

on:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi à 3 h 17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_data.py .
      - name: Publier
        run: |
          git config user.name "sunchaser-data"
          git config user.email "actions@users.noreply.github.com"
          git add -- *.tsv
          git diff --cached --quiet || git commit -m "Données du $(date -u +%F)"
          git push
